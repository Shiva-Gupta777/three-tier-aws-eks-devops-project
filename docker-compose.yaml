services:

  mongodb:
    image: mongo:7

    container_name: mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

  backend:

    build:
      context: ./backend

    container_name: backend

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env.docker

    depends_on:
      - mongodb

  frontend:

    build:
      context: ./frontend

    container_name: frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  mongo-data: