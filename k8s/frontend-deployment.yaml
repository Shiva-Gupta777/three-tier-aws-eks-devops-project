apiVersion: apps/v1

kind: Deployment

metadata:
  name: frontend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 876762733183.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce-frontend:latest

          ports:
            - containerPort: 3000