apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:

      labels:

        app: backend

    spec:

      containers:

      - name: backend

        image: 876762733183.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce-backend:latest

        ports:

        - containerPort: 5000