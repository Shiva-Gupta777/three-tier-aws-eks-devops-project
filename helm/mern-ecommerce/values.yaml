frontend:
  replicaCount: 2

  image:
    repository: 777724728331.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce-frontend
    tag: v1
    pullPolicy: IfNotPresent

  service:
    port: 3000
    targetPort: 80

backend:
  replicaCount: 2

  image:
    repository: 777724728331.dkr.ecr.ap-south-1.amazonaws.com/mern-ecommerce-backend
    tag: v1
    pullPolicy: IfNotPresent

  service:
    port: 8000
    targetPort: 8000

ingress:
  enabled: true

  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip