name: MERN Application CI

on:
  push:
    branches:
      - main

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t mern-ecommerce-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t mern-ecommerce-frontend:${{ github.sha }} \
            ./frontend

      - name: Verify Docker images
        run: docker images



       