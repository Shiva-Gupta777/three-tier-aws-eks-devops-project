name: MERN Application CI

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  docker-build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      
      - name: Configure AWS Credentials

        uses: aws-actions/configure-aws-credentials@v4

        with:

         role-to-assume: arn:aws:iam::876762733183:role/GitHubActionsECRRole
   
         aws-region: ap-south-1


      - name: Verify AWS Identity

        run: |

          aws sts get-caller-identity


      - name: Build backend Docker image
        run: |
          docker build \
            -t mern-ecommerce-backend:${{ github.sha }} \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t mern-ecommerce-frontend:${{ github.sha }} \
            ./frontend

      - name: Verify Docker images
        run: docker images

      



       